<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{display:inline-block}
body{width:600px;padding:26px;display:inline-block;color:#3e2c1b;
  font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  background:#f5f0e1;
  background-image:repeating-linear-gradient(0deg,rgba(181,101,29,.03) 0 1px,transparent 1px 26px),
    radial-gradient(ellipse 900px 500px at 50% -10%,#fdf9ee 0%,#f5f0e1 70%);
  border:3px double #b5651d;outline:6px solid #f5f0e1;box-shadow:inset 0 0 60px rgba(181,101,29,.08)}
.hdr{text-align:center;margin-bottom:14px}
.icon{font-size:34px}
h1{font-size:24px;letter-spacing:5px;color:#8c3b2e;margin-top:5px}
.settle{display:flex;gap:10px;margin-bottom:14px}
.settle .box{flex:1;background:#fdf9ee;border:1px solid #e3d5b8;border-radius:10px;text-align:center;padding:11px 6px}
.settle .v{font-size:19px;font-weight:bold;color:#b5651d}
.settle .k{font-size:12px;color:#9b855f;margin-top:3px}
.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;justify-content:space-between;background:#fdf9ee;border:1px solid #e3d5b8;
  border-left:4px solid #6b7b3c;border-radius:0 8px 8px 0;padding:9px 14px;font-size:14.5px}
.rrow b{color:#8c3b2e}
.foot{text-align:center;color:#9b855f;font-size:12px;margin-top:16px;letter-spacing:2px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="icon">🏦</div>
    <h1>银行信息</h1>
  </div>
  <div class="settle">
    <div class="box"><div class="v">Lv.{{ level }}</div><div class="k">信用等级</div></div>
    <div class="box"><div class="v">{{ balance }}</div><div class="k">当前存款</div></div>
    <div class="box"><div class="v">{{ limit }}</div><div class="k">存储上限</div></div>
    <div class="box"><div class="v">{{ interest }}</div><div class="k">可领利息</div></div>
  </div>
  <div class="rows">
    <div class="rrow"><b>升级费用</b><span>{{ upgrade_price }} 金币</span></div>
    <div class="rrow"><b>当前余额</b><span>{{ currency }} 金币</span></div>
    <div class="rrow"><b>利率说明</b><span>每小时 {{ rate }}，最多计算 {{ max_hours }} 小时</span></div>
  </div>
  <div class="foot">— 奴隶市场 · {{ plugin_version or "" }} —</div>
</body>
</html>
