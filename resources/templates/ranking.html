<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{display:inline-block}
body{width:600px;padding:26px;display:inline-block;color:#3e2c1b;
  font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  background:#f5f0e1;
  background-image:repeating-linear-gradient(0deg,rgba(181,101,29,.03) 0 1px,transparent 1px 26px),
    radial-gradient(ellipse 900px 500px at 50% -10%,#fdf9ee 0%,#f5f0e1 70%);
  border:3px double #b5651d;outline:6px solid #f5f0e1;box-shadow:inset 0 0 60px rgba(181,101,29,.08)}
.hdr{text-align:center;margin-bottom:8px}
.icon{font-size:34px}
h1{font-size:25px;letter-spacing:5px;color:#8c3b2e;margin-top:5px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:12px}
td{background:#fdf9ee;padding:8px 13px;font-size:14.5px}
tr td:first-child{border-radius:8px 0 0 8px;border-left:3px solid #c67b5c;width:56px;text-align:center;font-weight:bold;font-size:16px;color:#b5651d}
tr:nth-child(1) td:first-child{color:#d4a017}
tr:nth-child(2) td:first-child{color:#9aa2ab}
tr:nth-child(3) td:first-child{color:#b08050}
.pinfo{display:flex;align-items:center;gap:10px}
.pname{font-weight:bold}
.pid{font-size:11px;color:#9b855f}
.score{text-align:right;color:#8c3b2e;font-weight:bold;white-space:nowrap;border-radius:0 8px 8px 0}
.empty{text-align:center;color:#9b855f;padding:20px 0}
.foot{text-align:center;color:#9b855f;font-size:12px;margin-top:14px;letter-spacing:2px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="icon">🏆</div>
    <h1>{{ title or "排行榜" }}</h1>
  </div>
  {% if not rows %}
  <div class="empty">暂无数据</div>
  {% else %}
  <table>
    <tbody>
    {% for r in rows %}
    <tr>
      <td>{% if r.rank == 1 %}🥇{% elif r.rank == 2 %}🥈{% elif r.rank == 3 %}🥉{% else %}{{ r.rank }}{% endif %}</td>
      <td><div class="pinfo"><div><div class="pname">{{ r.name }}</div><div class="pid">{{ r.id }}</div></div></div></td>
      <td class="score">{{ r.score }}</td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  {% endif %}
  <div class="foot">— 奴隶市场 · {{ plugin_version or "" }} —</div>
</body>
</html>
